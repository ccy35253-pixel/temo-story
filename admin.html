<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" style="color-scheme: dark;">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="color-scheme" content="dark">
        <meta name="theme-color" content="#050505">
        <title>لوحة التحكم | temo store</title>
        <meta name="robots" content="noindex">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&amp;display=swap" rel="stylesheet" media="print">
        <noscript>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&display=swap" rel="stylesheet">
        </noscript>
        <style>
:root {
    --bg:#050505;
    --surface:#141416;
    --line:#26272b;
    --ink:#f2f2f3;
    --muted:#a1a4ab;
    --red:#e11d2e;
    --red-hi:#ff3b4a;
    --gray:#8a8d93;
    --on-red:#fff;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
}
html {
    scroll-padding-top:env(safe-area-inset-top,0px);
    -webkit-text-size-adjust:100%
}
* {
    box-sizing:border-box;
    margin:0
}
body {
    background:radial-gradient(520px 420px at 88% 6%,rgba(225,29,46,.34),transparent 70%),radial-gradient(620px 520px at 6% 48%,rgba(138,141,147,.22),transparent 70%),radial-gradient(560px 460px at 82% 90%,rgba(225,29,46,.26),transparent 70%),var(--bg);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:'Cairo',system-ui,sans-serif;
    line-height:1.8;
    font-size:17px
}
a {
    color:inherit;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent
}
:focus-visible {
    outline:3px solid var(--red-hi);
    outline-offset:3px
}
.wrap {
    max-width:1040px;
    margin:0 auto;
    padding:0 22px
}
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 22px;
    margin-top:14px;
    border-radius:18px;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 4px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)
}
.brand {
    font-weight:800;
    font-size:20px;
    text-decoration:none;
    letter-spacing:.14em;
    direction:ltr
}
.brand span {
    color:var(--red-hi)
}
nav {
    display:flex;
    gap:22px
}
nav a {
    text-decoration:none;
    color:var(--muted);
    font-weight:600
}
nav a:hover {
    color:var(--ink)
}
.hero {
    text-align:center;
    padding:34px 0 64px;
    position:relative;
    background:radial-gradient(ellipse 50% 55% at 50% 42%,rgba(225,29,46,.3),rgba(225,29,46,0))
}
.logo {
    position:relative;
    display:block;
    margin:0 auto;
    width:min(380px,78vw);
    height:auto
}
.hero p {
    position:relative;
    max-width:30em;
    margin:12px auto 0;
    color:var(--muted);
    font-size:19px
}
.cta {
    position:relative;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:28px
}
.btn {
    display:inline-block;
    background:var(--red);
    color:var(--on-red);
    font-weight:800;
    text-decoration:none;
    padding:12px 28px;
    border-radius:12px;
    border:2px solid var(--red);
    box-shadow:0 4px 14px rgba(225,29,46,.35)
}
.btn.ghost {
    background:rgba(255,255,255,.08);
    color:var(--ink);
    border-color:rgba(255,255,255,.25);
    box-shadow:none
}
.btn.ghost:hover {
    border-color:var(--red-hi)
}
h2 {
    font-size:30px;
    font-weight:800;
    margin-bottom:8px
}
h2::after {
    content:"";
    display:block;
    width:48px;
    height:4px;
    background:var(--red);
    margin-top:6px
}
.sub {
    color:var(--muted);
    margin:14px 0 28px
}
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px
}
.item,.vals>div {
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 4px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
    border-radius:18px
}
.item {
    padding:18px 18px 20px
}
.item:hover {
    border-color:rgba(255,59,74,.75);
    box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 18px rgba(225,29,46,.3),inset 0 1px 0 rgba(255,255,255,.18)
}
.art {
    height:130px;
    display:grid;
    place-items:center;
    margin-bottom:12px
}
.ring {
    width:84px;
    height:84px;
    border-radius:50%;
    border:12px solid var(--red)
}
.watch {
    width:92px;
    height:92px;
    border-radius:50%;
    border:6px solid var(--gray);
    display:grid;
    place-items:center;
    position:relative
}
.watch::before {
    content:"";
    width:3px;
    height:30px;
    background:var(--red-hi);
    position:absolute;
    bottom:50%;
    transform-origin:bottom
}
.watch::after {
    content:"";
    width:22px;
    height:3px;
    background:var(--ink);
    position:absolute;
    right:50%
}
.chain {
    width:110px;
    height:70px;
    border:8px dotted var(--gray);
    border-top:none;
    border-radius:0 0 60px 60px
}
.band {
    width:110px;
    height:56px;
    border:10px solid var(--red);
    border-radius:28px
}
.belt {
    width:120px;
    height:24px;
    background:var(--gray);
    position:relative;
    border-radius:2px
}
.belt::after {
    content:"";
    position:absolute;
    left:50%;
    top:-6px;
    width:28px;
    height:36px;
    border:5px solid var(--red);
    transform:translateX(-50%)
}
.wallet {
    width:100px;
    height:68px;
    background:#2b2c30;
    border:1px solid var(--gray);
    border-radius:6px;
    position:relative
}
.wallet::after {
    content:"";
    position:absolute;
    left:0;
    top:22px;
    width:100%;
    height:3px;
    background:var(--red)
}
.item h3 {
    font-size:19px;
    font-weight:600
}
.clutch {
    width:104px;
    height:64px;
    background:#2b2c30;
    border:1px solid var(--gray);
    border-radius:10px;
    position:relative
}
.clutch::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:26px;
    border-bottom:3px solid var(--red);
    border-radius:10px 10px 40px 40px/10px 10px 20px 20px
}
.clutch::after {
    content:"";
    position:absolute;
    left:50%;
    top:20px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--red);
    transform:translateX(-50%)
}
.wallet.imp,.clutch.imp {
    background:#3a1217;
    border-color:var(--red)
}
.belt.imp {
    background:#6b6d73
}
.boxer {
    width:90px;
    height:74px;
    background:#2b2c30;
    clip-path:polygon(0 0,100% 0,100% 55%,62% 100%,38% 100%,0 55%);
    position:relative
}
.boxer::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:12px;
    background:var(--red)
}
.cap {
    width:100px;
    height:48px;
    background:#2b2c30;
    border:2px solid var(--gray);
    border-bottom:none;
    border-radius:50px 50px 0 0;
    position:relative;
    margin-bottom:8px
}
.cap::before {
    content:"";
    position:absolute;
    left:50%;
    top:6px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--red);
    transform:translateX(-50%)
}
.cap::after {
    content:"";
    position:absolute;
    left:-8px;
    bottom:-8px;
    width:62px;
    height:9px;
    background:var(--red);
    border-radius:4px
}
.price {
    color:var(--muted)
}
.soc.ord {
    margin-top:12px;
    justify-content:center;
    color:var(--ink)
}
section {
    padding:56px 0
}
.about {
    background:rgba(255,255,255,.02);
    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08)
}
.about p {
    max-width:36em;
    color:var(--muted)
}
.vals {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:24px;
    margin-top:28px
}
.vals>div {
    padding:20px
}
.vals h3 {
    font-size:18px;
    color:var(--red-hi)
}
.vals p {
    font-size:16px
}
.phone {
    display:block;
    margin-top:18px;
    color:var(--muted);
    direction:ltr;
    text-align:right
}
footer {
    padding:36px 0 44px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px
}
.socials {
    position:relative;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:22px
}
.socials.bottom {
    justify-content:flex-start;
    margin-top:36px
}
.soc {
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:14px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)
}
.soc:hover {
    border-color:rgba(255,59,74,.75);
    box-shadow:0 3px 10px rgba(0,0,0,.4),0 0 14px rgba(225,29,46,.35),inset 0 1px 0 rgba(255,255,255,.18)
}
.soc:hover .ic {
    color:var(--red-hi)
}
.ic {
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round
}
@media (max-width:560px) {
    nav {
        gap:14px;
        font-size:15px
    }
}
@media (prefers-reduced-motion:no-preference) {
    .btn {
        transition:transform .15s
    }
    .btn:hover {
        transform:translateY(-2px)
    }
}
.btn:active,.soc:active {
    transform:scale(.97)
}
#lk[hidden] {
    display:none
}
#lk {
    position:fixed;
    left:12px;
    right:12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    z-index:50;
    max-width:420px;
    margin:0 auto;
    padding:16px;
    border-radius:16px;
    background:#1b1b1e;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 8px 24px rgba(0,0,0,.6)
}
#lk p {
    font-size:15px;
    margin-bottom:10px;
    line-height:1.7
}
#lk input {
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--gray);
    background:#0c0c0d;
    color:var(--ink);
    font:inherit;
    font-size:14px;
    direction:ltr
}
#lk .row {
    display:flex;
    gap:8px;
    margin-top:10px
}
#lk button {
    flex:1;
    padding:10px;
    border-radius:10px;
    border:0;
    background:var(--red);
    color:#fff;
    font:inherit;
    font-weight:800;
    cursor:pointer
}
#lk button[data-a=close] {
    background:#2b2c30
}
@media (min-width:900px) and (hover:hover) {
    .item,.vals>div,header,.soc {
        -webkit-backdrop-filter:blur(14px);
        backdrop-filter:blur(14px)
    }
}
.chips {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 6px
}
.chips a {
    padding:6px 16px;
    border-radius:999px;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    text-decoration:none;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16)
}
.chips a:hover {
    border-color:var(--red)
}
.cat {
    margin-top:40px;
    scroll-margin-top:80px
}
.cat .ct {
    font-size:24px;
    font-weight:800;
    margin:0 0 16px;
    padding-right:12px;
    border-right:4px solid var(--red)
}
#adm-list .ch {
    font-weight:800;
    border-top:2px solid var(--red);
    margin-top:10px
}
#adm-list .pi {
    padding-right:14px;
    color:var(--muted)
}
#admin h4 {
    margin:22px 0 0;
    font-size:18px
}
[hidden] {
    display:none!important
}
.vis {
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin:16px auto 0;
    padding:8px 20px;
    border-radius:14px;
    font-weight:600;
    color:var(--muted);
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)
}
.vis .n {
    color:var(--red-hi);
    font-weight:800;
    font-size:22px;
    direction:ltr
}
.art img {
    max-width:100%;
    max-height:130px;
    object-fit:contain;
    border-radius:10px
}
.adm-link {
    background:none;
    border:0;
    color:var(--muted);
    font:inherit;
    font-size:14px;
    cursor:pointer;
    text-decoration:underline;
    padding:4px
}
#admin .box {
    padding:22px;
    border-radius:18px;
    background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 4px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
    max-width:560px
}
#admin label {
    display:block;
    margin-top:12px;
    font-weight:600;
    font-size:15px
}
#admin input[type=text],#admin input[type=password],#admin input[type=number],#admin select {
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--gray);
    background:#0c0c0d;
    color:var(--ink);
    font:inherit;
    font-size:15px
}
#admin input[type=file] {
    width:100%;
    color:var(--muted);
    font-size:14px
}
#admin .chk {
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600
}
#admin .chk input {
    width:18px;
    height:18px
}
#admin .row {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px
}
#admin .btn {
    cursor:pointer;
    font:inherit;
    font-weight:800;
    padding:10px 20px
}
#admin .msg {
    margin-top:12px;
    font-size:15px;
    color:var(--muted)
}
#admin .msg.err {
    color:var(--red-hi)
}
#adm-top {
    position:sticky;
    top:8px;
    z-index:5;
    background:#0c0c0d;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--red)
}
#adm-list {
    list-style:none;
    padding:0;
    margin:18px 0 0
}
#adm-list li {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-top:1px solid rgba(255,255,255,.1)
}
#adm-list button {
    background:#2b2c30;
    color:var(--ink);
    border:1px solid rgba(255,255,255,.2);
    border-radius:8px;
    padding:4px 12px;
    font:inherit;
    font-size:14px;
    cursor:pointer
}
</style>
    </head>
    <body>
        <section id="admin">
            <div class="wrap">
                <h2>لوحة التحكم</h2>
                <p class="sub">
                    <a class="adm-link" href="index.html">رجوع للموقع</a>
                </p>
                <div class="box" id="adm-login">
                    <label for="adm-user">اسم المستخدم</label>
                    <input type="text" id="adm-user" autocomplete="username" dir="ltr">
                    <label for="adm-pw">كلمة السر</label>
                    <input type="password" id="adm-pw" autocomplete="current-password" dir="ltr">
                    <div class="row">
                        <button class="btn" id="adm-enter" type="button">دخول</button>
                    </div>
                    <div class="msg err" id="adm-err" hidden>
                    </div>
                </div>
                <div class="box" id="adm-panel" hidden>
                    <div class="msg" id="adm-top" hidden>
                    </div>
                    <div class="msg" id="adm-vis" hidden>
                    </div>
                    <div class="msg" id="adm-draft" hidden>
                    </div>
                    <h4>إضافة منتج</h4>
                    <label for="adm-cat">القسم</label>
                    <select id="adm-cat">
                    </select>
                    <label for="adm-name">اسم المنتج</label>
                    <input type="text" id="adm-name" maxlength="60">
                    <label for="adm-price">السعر بالجنيه (اختياري)</label>
                    <input type="number" id="adm-price" min="0" inputmode="numeric" dir="ltr">
                    <label for="adm-img">صورة المنتج (اختياري)</label>
                    <input type="file" id="adm-img" accept="image/*">
                    <div class="row">
                        <button class="btn" id="adm-add" type="button">إضافة المنتج</button>
                    </div>
                    <h4>إضافة قسم جديد</h4>
                    <label for="adm-cname">اسم القسم</label>
                    <input type="text" id="adm-cname" maxlength="40">
                    <label for="adm-cart">شكل الرسمة</label>
                    <select id="adm-cart">
                        <option value="wallet">محفظة</option>
                        <option value="clutch">كلاتش</option>
                        <option value="belt">حزام</option>
                        <option value="boxer">بوكسر</option>
                        <option value="cap">كاب</option>
                        <option value="watch">ساعة</option>
                    </select>
                    <label class="chk">
                        <input type="checkbox" id="adm-cimp"> مستورد</label>
                        <div class="row">
                            <button class="btn ghost" id="adm-cadd" type="button">إضافة القسم</button>
                        </div>
                        <ul id="adm-list">
                        </ul>
                        <h4>نشر التعديلات للزباين</h4>
                        <div class="msg">1) اضغط "تحميل products.json". 2) على GitHub افتح الـ repo واضغط Add file ثم Upload files، واسحب الملف (نفس الاسم بيستبدل القديم) واضغط Commit. 3) بعد حوالي دقيقة التعديل بيظهر لكل الزباين.</div>
                        <div class="row">
                            <button class="btn" id="adm-dl" type="button">تحميل products.json</button>
                            <button class="btn ghost" id="adm-reset" type="button">رجوع للنسخة المنشورة</button>
                            <button class="btn ghost" id="adm-out" type="button">تسجيل خروج</button>
                        </div>
                    </div>

async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function showPanel(){
$('adm-login').hidden=true;
$('adm-panel').hidden=false;
try{var d=JSON.parse(localStorage.getItem('temo_draft')||'null');
if(d&&Array.isArray(d.cats)&&Array.isArray(d.products)){S=d;
dirty=true}}catch(_){}
fillSel();
renderList();
banner();
if(window.fetch){
fetch('products.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){
if(d&&Array.isArray(d.cats)&&Array.isArray(d.products)){P=d;
if(!dirty){S=clone(P);
fillSel();
renderList()}}
}).catch(function(){});
fetch('https://abacus.jasoncameron.dev/get/temostore-ahmed2010/visits').then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){
if(typeof d.value==='number'){var v=$('adm-vis');
v.hidden=false;
v.textContent='عدد الزوار: '+d.value.toLocaleString('ar-EG')}
}).catch(function(){});
}
}
async function enter(){
var e=$('adm-err');
e.hidden=true;
if(!(window.crypto&&crypto.subtle)){e.hidden=false;
e.textContent='المتصفح ده مش بيدعم التحقق. جرّب متصفح تاني.';
return}
var ok=false;
try{ok=(await sha('temo|user|'+$('adm-user').value.trim().toLowerCase()))===HU&&(await sha('temo|'+$('adm-pw').value))===HP}catch(_){}
if(ok){try{sessionStorage.setItem('temo_admin','1')}catch(_){}$('adm-pw').value='';
showPanel()}
else{e.hidden=false;
e.textContent='اسم المستخدم أو كلمة السر غلط.'}
}

function readImg(file){return new Promise(function(res,rej){
var r=new FileReader();
r.onerror=rej;
r.onload=function(){var im=new Image();
im.onerror=rej;
im.onload=function(){
var m=640,k=Math.min(1,m/Math.max(im.width,im.height));
var c=document.createElement('canvas');
c.width=Math.round(im.width*k);
c.height=Math.round(im.height*k);
c.getContext('2d').drawImage(im,0,0,c.width,c.height);
res(c.toDataURL('image/jpeg',0.8))};
im.src=r.result};
r.readAsDataURL(file)})}
$('adm-add').addEventListener('click',async function(){
var cat=$('adm-cat').value;
if(!cat){msg('اختار القسم الأول.',true);
return}
var name=$('adm-name').value.trim();
if(!name){msg('اكتب اسم المنتج الأول.',true);
return}
var img='';
var f=$('adm-img').files[0];
if(f){try{img=await readImg(f)}catch(_){msg('الصورة مش اتقرت، جرّب صورة تانية.',true);
return}}
S.products.push({id:'p'+Date.now(),cat:cat,name:name,price:$('adm-price').value.trim(),img:img});
$('adm-name').value='';
$('adm-price').value='';
$('adm-img').value='';
change('اتضاف.');
});
